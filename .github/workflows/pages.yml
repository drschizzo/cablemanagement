name: GitHub Pages

# À chaque push sur main, le jeu est construit et publié sur GitHub Pages.
# Les vérifications (npm run check) se font en local avant de pousser ; la construction lance tsc.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# une seule publication à la fois ; une publication en cours n'est pas interrompue
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construction du jeu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
